name: CI

# Deployment is handled by Cloudflare Workers Builds, not here — this is purely
# a red/green gate, so no Cloudflare credentials are needed in GitHub.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Also proves every post's frontmatter is valid: the content loader
      # throws on a malformed post rather than rendering a broken card.
      - name: Build
        run: pnpm build
