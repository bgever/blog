# pnpm 11 reads build-script and supply-chain settings from here, NOT from a
# "pnpm" block in package.json — that block is silently ignored, which is how
# ERR_PNPM_IGNORED_BUILDS keeps firing if you configure it in the wrong place.

# Dependencies whose install scripts may run. Both ship their real binaries as
# per-platform optional dependencies, so the postinstall is not needed: the
# build, the tests and `wrangler dev` all work with these blocked. Keeping them
# false means no third-party install script runs on `pnpm install`.
allowBuilds:
  esbuild: false
  workerd: false

# pnpm 11 refuses packages published within the last 24 hours — a hedge against
# installing a compromised release before anyone has noticed it.
#
# Only wrangler is exempted. `miniflare` is not a separate decision: it is
# wrangler's own local runtime, published in lockstep, so exempting wrangler
# without it is not possible short of downgrading wrangler itself.
#
# Both entries are version-pinned, so each exemption disappears the moment that
# package is upgraded — there is no standing exemption for wrangler, only for
# the release that was audited. Prune them at the next dependency bump.
#
# Nothing else is listed: vue-tsc is pinned to a release old enough to satisfy
# the policy on its own rather than being waved through.
minimumReleaseAgeExclude:
  - miniflare@5.20260730.0-alpha
  - wrangler@4.118.0
