# pnpm 11 reads build-script and supply-chain settings from here, NOT from a
# "pnpm" block in package.json — that block is silently ignored, which is how
# ERR_PNPM_IGNORED_BUILDS keeps firing if you configure it in the wrong place.

# Dependencies whose install scripts may run. Both ship their real binaries as
# per-platform optional dependencies, so the postinstall is not needed: the
# build, the tests and `wrangler dev` all work with these blocked. Keeping them
# false means no third-party install script runs on `pnpm install`.
allowBuilds:
  esbuild: false
  workerd: false

# pnpm 11 refuses packages published within the last 24 hours — a hedge against
# installing a compromised release before anyone has noticed it.
#
# Cloudflare's own tooling is exempt by name rather than by version. This site
# runs on Cloudflare, so the deploy tooling should track whatever their platform
# is currently on; holding wrangler back by a day to satisfy a generic
# supply-chain heuristic trades a real compatibility risk for a notional one.
# `miniflare` is wrangler's local runtime and ships in lockstep with it.
#
# Deliberately unpinned: a version-pinned entry would lapse on every upgrade and
# have to be re-added, which is the opposite of tracking latest. Everything not
# listed here still goes through the full 24-hour quarantine.
minimumReleaseAgeExclude:
  - miniflare
  - wrangler
